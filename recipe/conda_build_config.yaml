# bun requires clang; the aggregate pins gcc 14.3 on linux and clang 20 on osx.
# Windows keeps the aggregate vs2022 toolchain.
c_compiler:
  - clang                      # [linux or osx]
cxx_compiler:
  - clangxx                    # [linux or osx]
c_compiler_version:
  - 21                         # [linux or osx]
cxx_compiler_version:
  - 21                         # [linux or osx]
# NOTE: c_stdlib_version is intentionally not set here — it needs different
# values per platform, which would duplicate the key and the linter rejects
# duplicate YAML keys. The aggregate values are used instead.
