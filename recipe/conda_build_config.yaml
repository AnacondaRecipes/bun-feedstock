# bun requires clang; the aggregate pins gcc 14.3 on linux and clang 20 on osx.
c_compiler:
  - clang                      # [linux or osx]
  - vs2022                     # [win]
cxx_compiler:
  - clangxx                    # [linux or osx]
  - vs2022                     # [win]
c_compiler_version:
  - 21                         # [linux or osx]
cxx_compiler_version:
  - 21                         # [linux or osx]
# bun's build refuses an macOS SDK older than 13.0.
c_stdlib_version:
  - 2.28                       # [linux]
  - 13.0                       # [osx]
  - 2022.14                    # [win]
