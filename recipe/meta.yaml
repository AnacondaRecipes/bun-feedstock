{% set name = "bun" %}
{% set version = "1.4.2" %}
# Commit the bun-v{{ version }} tag points at; the source tarball has no .git,
# so build.sh hands it to scripts/build.ts as the revision.
{% set git_sha = "744846f844374847c902b5e7fd59b4342a51ef99" %}
# WEBKIT_VERSION in scripts/build/deps/webkit.ts (build.sh checks they match).
{% set webkit_version = "2e2aa2290fac856d6f451ceacb58f7f5b44dd057" %}
{% set webkit_asset = "bun-webkit-linux-amd64" %}  # [linux and x86_64]
{% set webkit_asset = "bun-webkit-linux-arm64" %}  # [linux and aarch64]
{% set webkit_asset = "bun-webkit-macos-arm64" %}  # [osx and arm64]
{% set webkit_asset = "bun-webkit-windows-amd64" %}  # [win]

package:
  name: {{ name }}
  version: {{ version }}

source:
  - url: https://github.com/oven-sh/bun/archive/refs/tags/bun-v{{ version }}.tar.gz
    sha256: e14670b117d69012d828514d657f0a3133d1c25d13d69461184d05b6a8e9a876
    patches:
      # We build with --ci on macOS (see build.sh) and upstream's CI "full" mode
      # skips the precompiled header, which several JSC/WebKit headers rely on.
      - 0003-keep-pch-in-ci-mode.patch
      # macOS links go through ld64.lld (see build.sh): apply upstream's
      # ld64.lld link fixups (cross-link only upstream) to native links too, and
      # drop Apple's -ld_new. Without them `bun build --compile` fails with
      # OverlappingSegments and the binary keeps an 8 MB (not 18 MB) stack.
      - 0005-darwin-link-with-ld64-lld.patch

  # Prebuilt bun, used only to bootstrap scripts/build.ts (the source tarball
  # ships no binary). The selector is repeated on every line of each entry:
  # a selector on only the url line leaves the sha256/folder lines behind and
  # they attach to the neighbouring entry.
  - url: https://github.com/oven-sh/bun/releases/download/bun-v{{ version }}/bun-linux-x64-baseline.zip  # [linux and x86_64]
    sha256: c678040f14fe0440eb839d37cbd0ce4c051a32da72806ac97de6a6aab6bf728f  # [linux and x86_64]
    folder: bun.native  # [linux and x86_64]
  - url: https://github.com/oven-sh/bun/releases/download/bun-v{{ version }}/bun-linux-aarch64.zip  # [linux and aarch64]
    sha256: 54328bbc2d9c8e0c9f892c544d66c57a83b84139e34909e5ee81758f1ac8fda7  # [linux and aarch64]
    folder: bun.native  # [linux and aarch64]
  - url: https://github.com/oven-sh/bun/releases/download/bun-v{{ version }}/bun-darwin-x64.zip  # [osx and x86_64]
    sha256: 80520d7e17526308c9185d261679ac6d27798d3803a0e9f7ff9121ab8affb012  # [osx and x86_64]
    folder: bun.native  # [osx and x86_64]
  - url: https://github.com/oven-sh/bun/releases/download/bun-v{{ version }}/bun-darwin-aarch64.zip  # [osx and arm64]
    sha256: 90987a3a16d7db556d886ac3d551e7b6d3edf0a1cf43acaed622e8676be1d12f  # [osx and arm64]
    folder: bun.native  # [osx and arm64]
  - url: https://github.com/oven-sh/bun/releases/download/bun-v{{ version }}/bun-windows-x64.zip  # [win]
    sha256: ce4c17497b2f29712a99d3d53f028de28cd42e3bacb8589599e7f000e49b6405  # [win]
    folder: bun.native  # [win]

  # oven-sh/WebKit prebuilt JavaScriptCore/WebKit: upstream's default
  # `prebuilt` mode (building WebKit from source is not feasible here). bun's
  # downloader keys its cache on the URL and never checks the bytes, so it is
  # pinned here and build.sh serves it via BUN_BUILD_PREFETCH_DIR. The .bin
  # name stops conda-build from extracting it.
  - url: https://github.com/oven-sh/WebKit/releases/download/autobuild-{{ webkit_version }}/{{ webkit_asset }}.tar.gz
    sha256: 2c614235705e1c30048125671e2cdaa93849ea3bf4e0b9a904e3c7368312af0a  # [linux and x86_64]
    sha256: 35adf76b39487bbc07c162d79f79ffd18801e5d7937f0df72d24db8dc2043b6e  # [linux and aarch64]
    sha256: 348d4b9a97d2a17e997e9b09d084761e88748dd20586b15317f717299de70ab2  # [osx and arm64]
    sha256: 692315885cf2d1e426da22ff031c6ade9c4a8e1be989ff7f70e0cb7390c53b17  # [win]
    fn: bun-webkit-prebuilt.bin
    folder: webkit-prebuilt

  # Licences of statically linked code that the build does not unpack into
  # vendor/: WebKit/JavaScriptCore (LGPL) and its bundled simdutf, pinned to
  # the WebKit commit above, and ICU 78 (bundled by the linux/windows
  # prebuilts; headers on macOS).
  - url: https://raw.githubusercontent.com/oven-sh/WebKit/{{ webkit_version }}/Source/JavaScriptCore/COPYING.LIB
    sha256: 5094ecb9c9dcd0eadc34f3c11511d9b5535063032bc150164ecd1a5d5a445547
    fn: webkit-JavaScriptCore-COPYING.LIB
  - url: https://raw.githubusercontent.com/oven-sh/WebKit/{{ webkit_version }}/Source/WebCore/LICENSE-LGPL-2
    sha256: 7555fa34bc131a75ca56d65c40cc1ea8f9515d23e353d4c15d58573a042f7805
    fn: webkit-WebCore-LICENSE-LGPL-2
  - url: https://raw.githubusercontent.com/oven-sh/WebKit/{{ webkit_version }}/Source/WebCore/LICENSE-LGPL-2.1
    sha256: f2b3bd09663381deb99721109d22b47af1213bb43007a8b56a06c6375c8050ce
    fn: webkit-WebCore-LICENSE-LGPL-2.1
  - url: https://raw.githubusercontent.com/oven-sh/WebKit/{{ webkit_version }}/Source/WebCore/LICENSE-APPLE
    sha256: 0b5d3a7cc325942567373b0ecd757d07c132e0ebd7c97bfc63f7e1a76094edb4
    fn: webkit-WebCore-LICENSE-APPLE
  - url: https://raw.githubusercontent.com/oven-sh/WebKit/{{ webkit_version }}/Source/WTF/wtf/simdutf/LICENSE-simdutf.txt
    sha256: fc8dbc04e03ad4efc08a647ffe7f995b811a95bc04c0e85a56d5277c6593fa5f
    fn: simdutf-LICENSE
  - url: https://raw.githubusercontent.com/unicode-org/icu/release-78.1/icu4c/LICENSE
    sha256: 1e881ecf2862d01e6e5bc2b861e46886d2a6fb01499c0c508a209a7271b13cf2
    fn: icu-LICENSE

build:
  number: 0
  # conda-build's rpath step (patchelf --force-rpath --set-rpath $ORIGIN/../lib)
  # appends a PT_LOAD to this 75 MB binary whose page range overlaps the next
  # segment's first page, giving an ELF the kernel refuses to map -- the linux
  # test then dies with SIGSEGV at exec, before any code runs
  # ("Uhuuh, elf segment at 0x20f000 requested but the memory is mapped
  # already"). bun's link emits no RPATH and every DT_NEEDED is a system
  # library (libc/ld-linux/libpthread/libdl/libm), so it is not needed.
  binary_relocation: false
  # Passed under a neutral name and exported by build.sh / bld.bat: any
  # upper-case "G I T _" token in this file makes conda-build treat the recipe
  # as VCS-based and download every source just to render it.
  script_env:
    - CONDA_BUN_REVISION={{ git_sha }}
    - CONDA_WEBKIT_VERSION={{ webkit_version }}
    - CONDA_WEBKIT_ASSET={{ webkit_asset }}
  # bun links its C++ runtime statically (conda-build reports these as unused
  # run deps), and icu is only in host for its headers: bun links the system
  # libicucore on macOS (scripts/build/bun.ts), never conda's ICU.
  ignore_run_exports:
    - libstdcxx     # [linux]
    - libcxx        # [osx]
    - icu           # [osx]
    - vc14_runtime  # [win]

requirements:
  build:
    - {{ compiler('c') }}
    - {{ compiler('cxx') }}
    - {{ stdlib('c') }}
    # bun requires LLVM 21 (upstream CONTRIBUTING); pin the three so the
    # compiler, linker and binutils cannot resolve to different majors.
    # No selector: windows needs clang-cl/lld-link/llvm-rc here too.
    - clang 21.1.8
    - lld 21.1.8
    - llvm-tools 21.1.8
    - cmake
    - git        # vendored-dep patches are applied with `git apply`
    - nasm       # boringssl / libjpeg-turbo assembly
    - perl       # boringssl + LUT codegen
    - ninja-base
    # bun links libatomic statically on linux (-l:libatomic.a); gcc_impl is
    # the package that ships libatomic.a in the GCC install dir clang searches.
    - gcc_impl_{{ target_platform }} 15.2.0  # [linux]
    # Upstream's pinned nightly. The release profile rebuilds std with
    # -Zbuild-std, which needs rust-src in the rustc sysroot; rust-src-nightly
    # installs it there and is constrained to this exact rust-nightly build.
    - rust-nightly {{ rust_nightly_compiler_version }}
    - rust-src-nightly {{ rust_nightly_compiler_version }}
  # The osx build needs ICU headers for the prebuilt WebKit headers (the worker
  # SDK is too old to ship them); the linux/windows prebuilts bundle their own.
  host:
    - icu {{ icu }}  # [osx]
  run:
    # bun's --ci build uses a 13.0 deployment target, above the aggregate
    # c_stdlib_version, so the stdlib run_export alone is too permissive.
    - __osx >=13.0  # [osx]

test:
  files:
    - share/bash-completion/completions/bun  # [unix]
    - share/zsh/site-functions/_bun  # [unix]
    - share/fish/vendor_completions.d/bun.fish  # [unix]
    - Library/share/bash-completion/completions/bun  # [win]
    - Library/share/zsh/site-functions/_bun  # [win]
    - Library/share/fish/vendor_completions.d/bun.fish  # [win]
  commands:
    - bun --version
    - bun --help
    - bunx --version
    # Release build, not canary: `1.4.2+<sha>`, never `1.4.2-canary.N+<sha>`.
    - bun --revision | grep -Fx "{{ version }}+{{ git_sha[:9] }}"    # [unix]
    # findstr /X misses whole-line matches on piped input; a literal substring
    # still rejects canary ("1.4.2-canary.1+<sha>" does not contain "1.4.2+<sha>").
    - bun --revision | findstr /L /C:"{{ version }}+{{ git_sha[:9] }}"  # [win]
    # Exercise the JS engine, and on macOS the system-ICU symbols that
    # build.sh defers to load time.
    - bun -e "if (1 + 1 !== 2) process.exit(1)"
    - bun -e "if (!new Intl.NumberFormat('en').formatRange(1, 2)) process.exit(1)"
    # `bun build --compile` must be able to embed a bundle into this binary
    # (downstream feedstocks such as kilo are built this way). The bundle is
    # >16 KB so it has to grow the placeholder section, not just fill it.
    - bun -e "require('fs').writeFileSync('compile-test.js', 'console.log(' + JSON.stringify('x'.repeat(100000)) + '.length)')"
    - bun build --compile compile-test.js --outfile compile-test
    - ./compile-test | grep -Fx 100000  # [unix]
    - compile-test.exe | findstr /L /C:100000  # [win]

about:
  home: https://bun.sh
  dev_url: https://github.com/oven-sh/bun
  doc_url: https://bun.sh/docs
  # bun is MIT but statically links LGPL JavaScriptCore/WebKit and tinycc plus
  # the libraries listed in upstream LICENSE.md.
  license: MIT AND LGPL-2.0-or-later AND LGPL-2.1-or-later AND Apache-2.0 AND Apache-2.0 WITH LLVM-exception AND BSD-2-Clause AND BSD-3-Clause AND ISC AND Zlib AND IJG AND Unicode-3.0 AND (BSD-3-Clause OR GPL-2.0-only)
  license_family: OTHER
  license_file:
    - LICENSE.md
    - packages/bun-usockets/LICENSE
    - packages/bun-uws/LICENSE
    - src/clap/LICENSE
    - picohttp-LICENSE-MIT
    - webkit-JavaScriptCore-COPYING.LIB
    - webkit-WebCore-LICENSE-LGPL-2
    - webkit-WebCore-LICENSE-LGPL-2.1
    - webkit-WebCore-LICENSE-APPLE
    - simdutf-LICENSE
    - icu-LICENSE
    # Unpacked into vendor/ by scripts/build.ts at the pinned commits.
    - vendor/boringssl/LICENSE
    - vendor/brotli/LICENSE
    - vendor/cares/LICENSE.md
    - vendor/hdrhistogram/LICENSE.txt
    - vendor/hdrhistogram/COPYING.txt
    - vendor/highway/LICENSE
    - vendor/libarchive/COPYING
    - vendor/libdeflate/COPYING
    - vendor/libjpeg-turbo/LICENSE.md
    - vendor/libspng/LICENSE
    - vendor/libuv/LICENSE  # [win]
    - vendor/libwebp/COPYING
    - vendor/lolhtml/LICENSE
    - vendor/lshpack/LICENSE
    - vendor/lsqpack/LICENSE
    - vendor/lsquic/LICENSE
    - vendor/lsquic/LICENSE.chrome
    - vendor/mimalloc/LICENSE
    - vendor/rust-argon2/LICENSE-MIT
    - vendor/rust-argon2/LICENSE-APACHE
    - vendor/tinycc/COPYING
    - vendor/zlib/LICENSE.md
    - vendor/zstd/LICENSE
    - vendor/zstd/COPYING
  summary: Bun is a fast all-in-one JavaScript runtime
  description: |
    Bun is an all-in-one JavaScript runtime and toolkit distributed as a single
    executable: runtime, bundler, test runner and package manager.

extra:
  recipe-maintainers:
    - xhochy
    - pavelzw
    - I-Al-Istannen
